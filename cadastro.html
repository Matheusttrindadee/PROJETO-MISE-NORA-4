<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mise Nora - Cadastrar</title>
  <link rel="stylesheet" href="style.css">
  <!-- Carrega a biblioteca do Supabase no <head> ou no início dos scripts -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="./assets/js/conexao.js"></script>
</head>
<body>

    <header>
        <img src="img/logo-1.png" alt="Logo da Mise Nora" width="200px">
        <nav>
            <br>
            <a class="botao" href="index.html">Início</a>
            <a class="botao" href="login.html">Entrar</a>
        </nav>
    </header>

    <div class="containerapresentacao">
        <br>
        <h2>Crie sua Conta</h2>
        <p>Cadastre-se para realizar pedidos com facilidade, acompanhar suas reservas e ter uma experiência personalizada no Mise Nora.</p>
        <br>
    </div>
    <br>

    <div class="containerprincipal">
        <div class="containercardapio">
            <h3>Cadastro de Cliente</h3>
            <br>
            <form action="cadastro_action.php" method="POST" class="form-cadastro">
                <div>
                    <label for="nome"><strong>Nome Completo:</strong></label><br>
                    <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                </div>
                <br>
                <div>
                    <label for="email"><strong>E-mail:</strong></label><br>
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </div>
                <br>
                <div>
                    <label for="telefone"><strong>Telefone / WhatsApp:</strong></label><br>
                    <input type="tel" id="telefone" name="telefone" placeholder="(00) 00000-0000" required>
                </div>
                <br>
                <div>
                    <label for="senha"><strong>Senha:</strong></label><br>
                    <input type="password" id="senha" name="senha" placeholder="Crie uma senha segura" required>
                </div>
                <br>
                <div>
                    <label for="confirmar_senha"><strong>Confirmar Senha:</strong></label><br>
                    <input type="password" id="confirmar_senha" name="confirmar_senha" placeholder="Repita sua senha" required>
                </div>
                <br>
                <button type="submit" class="botaoadicionaraocarrinho">Criar Conta</button>
            </form>
            <br>
            <p>Já possui uma conta? <a href="login.html">Clique aqui para entrar</a>.</p>
        </div>
    </div>
    <br>

    <footer>
        <nav>
            <a class="botaorodape" href="index.html">Início</a>
        </nav>
    </footer>
<script type="module" src="./assets/js/app.js"></script>
</body>
</html>
